name: Candidate Windows metadata locks

on:
    push:
        branches: ["jacobcxdev/windows-lock-pilot"]

permissions:
    contents: read

defaults:
    run:
        shell: bash

concurrency:
    group: candidate-windows-locks-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_BUILD_JOBS: 1
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_DEV_DEBUG: 0
    CARGO_PROFILE_TEST_DEBUG: 0
    CARGO_PROFILE_DEV_CODEGEN_UNITS: 256
    CARGO_PROFILE_TEST_CODEGEN_UNITS: 256
    RUST_BACKTRACE: 1

jobs:
    contracts:
        name: Candidate metadata locks (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-2025]
        steps:
            - name: Checkout reviewed candidate
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Install pinned Rust
              uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
              with:
                  toolchain: 1.99.0
                  components: clippy
            - name: Restore dependencies
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
              with:
                  key: candidate-contracts-${{ runner.os }}
                  cache-on-failure: true
            - name: Record source and compiler identities
              run: |
                  git rev-parse HEAD 'HEAD^{tree}'
                  sha256sum Cargo.toml Cargo.lock rca-core/Cargo.toml rca-core/src/store/mutex.rs
                  rustc --version --verbose
                  cargo --version
            - name: Check normal Windows dependency boundary
              if: runner.os == 'Windows'
              run: |
                  cargo tree --locked -p rca-core --no-default-features --target x86_64-pc-windows-msvc --edges normal --prefix none > "$RUNNER_TEMP/windows-lock-dependencies.txt"
                  cat "$RUNNER_TEMP/windows-lock-dependencies.txt"
                  ! grep -E '^parking_lot(_core)? v' "$RUNNER_TEMP/windows-lock-dependencies.txt"
            - name: Test minimal Core ownership contracts
              run: cargo test --locked -p rca-core --no-default-features --lib -- --nocapture --test-threads=1
            - name: Test rich Core ownership contracts
              run: cargo test --locked -p rca-core --all-features --lib -- --nocapture --test-threads=1
            - name: Test cleanup and re-entry boundaries
              run: |
                  cargo test --locked -p rca-core --all-features --test terminal_unwind --test removed_child --test local_removed_child --test mount_acquisition --test fold --test fold_local --test fold_terminal --test changed_reactions --test output_delivery --test local_output_delivery -- --nocapture --test-threads=1
            - name: Check allocation and layout boundaries
              if: runner.os == 'Windows'
              run: |
                  cargo test --locked -p rca-core --features allocation-measurement --test core_allocations store::mailbox::tests::unsaturated_round_trips_do_not_allocate -- --exact --nocapture
                  cargo test --locked -p rca-core --features allocation-measurement --test core_allocations store::scope::output_origin_costs::output_origin_costs -- --exact --nocapture
                  cargo test --locked -p rca-core --features allocation-measurement,test-util --test core_allocations store::scope::output_origin_costs::output_origin_costs -- --exact --nocapture
                  cargo test --locked -p rca-core --features allocation-measurement,test-util --test core_allocations store::task_context::terminal_receipt_tests::terminal_receipt_first_access_is_allocation_free -- --exact --nocapture
            - name: Check production documentation and lint
              run: |
                  cargo clippy --locked -p rca-core --lib --all-features -- -D warnings -D missing_docs -D clippy::missing_docs_in_private_items
