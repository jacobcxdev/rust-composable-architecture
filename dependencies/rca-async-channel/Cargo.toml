# Modified for Rust Composable Architecture; see UPSTREAM.md.
# The original upstream manifest is preserved in Cargo.toml.upstream.

[package]
edition = "2021"
rust-version = "1.98.0"
name = "rca-async-channel"
version = "0.1.0"
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
build = false
exclude = ["/.*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "RCA fork of async-channel"
readme = "README.md"
keywords = [
    "mpmc",
    "mpsc",
    "spmc",
    "chan",
    "futures",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jacobcxdev/rust-composable-architecture"

[features]
default = ["std"]
portable-atomic = [
    "concurrent-queue/portable-atomic",
    "event-listener-strategy/portable-atomic",
    "dep:portable-atomic-util",
    "dep:portable-atomic",
]
std = [
    "concurrent-queue/std",
    "event-listener-strategy/std",
]

[lib]
name = "async_channel"
path = "src/lib.rs"

[[test]]
name = "bounded"
path = "tests/bounded.rs"

[[test]]
name = "unbounded"
path = "tests/unbounded.rs"

[[test]]
name = "public_contracts"
path = "tests/public_contracts.rs"

[dependencies.concurrent-queue]
version = "2.5"
default-features = false

[dependencies.event-listener-strategy]
package = "rca-event-listener-strategy"
version = "=0.1.0"
path = "../rca-event-listener-strategy"
default-features = false

[dependencies.futures-core]
version = "0.3.5"
default-features = false

[dependencies.pin-project-lite]
version = "0.2.11"

[dependencies.portable-atomic]
version = "1"
features = ["require-cas"]
optional = true
default-features = false

[dependencies.portable-atomic-util]
version = "0.2"
features = ["alloc"]
optional = true
default-features = false

[dev-dependencies.easy-parallel]
version = "3"

[dev-dependencies.futures-lite]
version = "2"

[target.'cfg(target_family = "wasm")'.dev-dependencies.wasm-bindgen-test]
version = "0.3.37"
