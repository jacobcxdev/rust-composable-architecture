# Modified for Rust Composable Architecture; see UPSTREAM.md.
# The original upstream manifest is preserved in Cargo.toml.upstream.

[package]
edition = "2021"
rust-version = "1.99.0"
name = "rca-event-listener"
version = "0.1.0"
authors = [
    "Stjepan Glavina <stjepang@gmail.com>",
    "John Nunley <dev@notgull.net>",
]
build = false
exclude = ["/.*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "RCA fork of event-listener"
readme = "README.md"
keywords = [
    "condvar",
    "eventcount",
    "wake",
    "blocking",
    "park",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jacobcxdev/rust-composable-architecture"

[features]
default = ["std"]
loom = [
    "parking?/loom",
    "dep:loom",
]
portable-atomic = [
    "portable-atomic-util",
    "portable_atomic_crate",
]
std = ["parking"]

[lib]
name = "event_listener"
path = "src/lib.rs"
bench = false

[[example]]
name = "mutex"
path = "examples/mutex.rs"
test = true

[[test]]
name = "loom"
path = "tests/loom.rs"

[[test]]
name = "notify"
path = "tests/notify.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false
required-features = ["std"]

[dependencies.arrayvec]
version = "0.7.8"
default-features = false

[dependencies.critical-section]
version = "1.2.0"
optional = true
default-features = false

[dependencies.pin-project-lite]
version = "0.2.12"

[dependencies.portable-atomic-util]
version = "0.2.0"
features = ["alloc"]
optional = true
default-features = false

[dependencies.portable_atomic_crate]
version = "1.2.0"
optional = true
default-features = false
package = "portable-atomic"

[dev-dependencies.criterion]
version = "0.8"
features = ["cargo_bench_support"]
default-features = false

[dev-dependencies.critical-section]
version = "1.2.0"
features = ["std"]

[dev-dependencies.futures-lite]
version = "2.0.0"

[dev-dependencies.try-lock]
version = "0.2.5"

[dev-dependencies.waker-fn]
version = "1"

[target."cfg(loom)".dependencies.loom]
version = "0.7"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.parking]
version = "2.0.0"
optional = true

[target.'cfg(target_family = "wasm")'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(loom)"]

[[test]]
name = "callback_contracts"
path = "tests/callback_contracts.rs"

[[test]]
name = "public_surface"
path = "tests/public_surface.rs"

[[test]]
name = "blocking"
path = "tests/blocking.rs"
required-features = ["std"]

[[test]]
name = "panic_contracts"
path = "tests/panic_contracts.rs"

[[test]]
name = "first_use"
path = "tests/first_use.rs"

[[test]]
name = "racing_loom"
path = "tests/racing_loom.rs"
required-features = ["std", "loom"]

[[test]]
name = "backend_contention"
path = "tests/backend_contention.rs"

[[test]]
name = "generic_contracts"
path = "tests/generic_contracts.rs"
required-features = ["std"]

[[test]]
name = "notification_policy"
path = "tests/notification_policy.rs"
