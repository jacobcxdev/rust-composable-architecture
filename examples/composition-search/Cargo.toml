[package]
name = "rca-example-composition-search"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[example]]
name = "authorisation"
test = true

[[example]]
name = "named_operations"
test = true

[[example]]
name = "owned_importer"
test = true

[[example]]
name = "uploader"
test = true

[dependencies]
rca = { path = "../../crates/rca", version = "=0.1.0", features = ["macros", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
rca = { path = "../../crates/rca", version = "=0.1.0", features = ["macros", "test-util"] }
futures-executor.workspace = true
# Request/reply examples need sync; the main application does not.
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
