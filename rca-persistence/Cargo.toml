[package]
name = "rca-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Runtime-neutral document persistence for Rust Composable Architecture"

[features]
default = []
file = ["dep:tokio", "dep:tempfile"]

[dependencies]
async-channel.workspace = true
rca-core.workspace = true
tokio = { workspace = true, optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
dhat.workspace = true
futures-executor.workspace = true
rca-test.workspace = true

[lints]
workspace = true

[[test]]
name = "allocation_controls"
path = "src/allocation_main.rs"
harness = false
required-features = ["file"]
