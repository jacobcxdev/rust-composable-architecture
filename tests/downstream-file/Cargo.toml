[package]
name = "rca-file-downstream"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[dependencies]
architecture = { package = "rust-composable-architecture", version = "=0.1.0", registry = "rca-local", default-features = false, features = ["tokio"] }
documents = { package = "rca-persistence", version = "=0.1.0", registry = "rca-local", default-features = false, features = ["file"] }
tokio = { version = "1.53.3", features = ["rt", "time"] }
tempfile = "3.27.0"
