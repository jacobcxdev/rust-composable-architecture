[package]
name = "composable-counter-candidate"
version = "0.0.0"
edition = "2021"
default-run = "composable-counter-candidate"

[workspace]

[features]
allocation-measurement = ["dep:dhat"]

[[test]]
name = "allocation_controls"
path = "../allocation_main.rs"
harness = false
required-features = ["allocation-measurement"]

[dev-dependencies]
serde_json = "1"

[dependencies]
dhat = { version = "=0.3.3", optional = true }
rca-core = { path = "../../../rca-core" }
rca-tokio = { path = "../../../rca-tokio" }
tokio = { version = "1.53.3", features = ["rt", "time"] }
