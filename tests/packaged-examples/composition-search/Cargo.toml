[package]
name = "rca-example-composition-search"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[dependencies]
rca = { package = "rust-composable-architecture", version = "=0.1.0", registry = "rca-local", features = ["macros", "test-util", "tokio"] }
tokio = { version = "1.53.3", features = ["macros", "rt", "time"] }

[dev-dependencies]
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
