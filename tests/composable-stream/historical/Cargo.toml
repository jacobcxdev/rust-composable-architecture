[package]
name = "composable-stream-historical"
default-run = "composable-stream-historical"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "common-outcome-allocations"
path = "src/bin/common_outcome_allocations.rs"
required-features = ["allocation-measurement"]
test = false
bench = false

[features]
allocation-measurement = ["dep:dhat"]

[dependencies]
dhat = { version = "=0.3.3", optional = true }
composable = { git = "https://github.com/jacobcxdev/rust-composable-architecture.git", rev = "c6200234cebbbd9b0009cd5788736c78a47f32b0" }
futures = "0.3"
