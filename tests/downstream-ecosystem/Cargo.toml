[package]
name = "rca-ecosystem-downstream"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[dependencies]
architecture = { package = "rust-composable-architecture", version = "=0.1.0", registry = "rca-local", default-features = false, features = ["diagnostics", "macros", "test-util"] }
testing = { package = "rca-test", version = "=0.1.0", registry = "rca-local" }
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
