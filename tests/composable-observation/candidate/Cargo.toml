[package]
name = "composable-observation-candidate"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
allocation-measurement = ["dep:dhat"]

[[bin]]
name = "observation-allocations"
path = "src/allocations.rs"
required-features = ["allocation-measurement"]
test = true

[[test]]
name = "reporter"
path = "../reporter_tests.rs"
required-features = ["allocation-measurement"]

[[test]]
name = "allocation_controls"
path = "src/allocation_controls.rs"
harness = false
required-features = ["allocation-measurement"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
dhat = { version = "=0.3.3", optional = true }
rca-core = { path = "../../../rca-core" }
rca-tokio = { path = "../../../rca-tokio" }
tokio = { version = "1.53.3", features = ["rt", "time"] }
