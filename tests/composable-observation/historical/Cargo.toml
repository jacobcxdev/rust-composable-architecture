[package]
name = "composable-observation-historical"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
allocation-measurement = ["dep:dhat"]

[[bin]]
name = "observation-allocations"
path = "src/allocations.rs"
required-features = ["allocation-measurement"]
test = true

[[test]]
name = "reporter"
path = "../reporter_tests.rs"
required-features = ["allocation-measurement"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
dhat = { version = "=0.3.3", optional = true }
composable = { git = "https://github.com/jacobcxdev/rust-composable-architecture.git", rev = "c6200234cebbbd9b0009cd5788736c78a47f32b0" }
