[profile.default]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

[test-groups]
benchmark-smoke = { max-threads = 1 }
model-checking = { max-threads = 1 }
panic-subprocess = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(runtime)"
test-group = "benchmark-smoke"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "binary(property_runtime) | binary(loom)"
test-group = "model-checking"
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "binary(panic_subprocess)"
test-group = "panic-subprocess"
slow-timeout = { period = "10s", terminate-after = 1 }
