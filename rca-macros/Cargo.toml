[package]
name = "rca-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Optional syntax for Rust Composable Architecture"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro-crate = "3.5.0"
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit-mut"] }

[dev-dependencies]
futures-executor.workspace = true
insta.workspace = true
# Cargo omits these workspace-only test dependencies from the published crate.
# Giving them versions would make Core, Test, and Macros a publishing cycle.
rca = { package = "rca-core", path = "../rca-core" }
rca-test = { path = "../rca-test" }
trybuild.workspace = true

[lints]
workspace = true
