[package]
name = "rca-qualification-zero"
version = "0.0.0"
edition.workspace = true
publish = false

[[test]]
name = "composition_zero"
path = "main.rs"
harness = false
required-features = ["allocation-measurement"]

[features]
default = []
allocation-measurement = ["rca-core/allocation-measurement"]

[dependencies]
rca-core.workspace = true
dhat.workspace = true
futures-executor.workspace = true
futures-util.workspace = true

# Keep features that the original test host unified through dev-dependencies.
event-listener = { workspace = true, features = ["loom"] }
concurrent-queue = { workspace = true, features = ["loom"] }
crossbeam-utils = { version = "=0.8.22", default-features = false, features = ["std"] }
serde_core = { version = "=1.0.229", features = ["alloc"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }

[build-dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }
