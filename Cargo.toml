[workspace]
resolver = "3"
members = [
    "dependencies/rca-event-listener",
    "dependencies/rca-event-listener-strategy",
    "dependencies/rca-async-channel",
    "rca",
    "rca-core",
    "rca-macros",
    "rca-persistence",
    "rca-test",
    "rca-tokio",
    "examples/composition-search",
    "examples/mcmd-server",
    "examples/persistent-counter",
    "tests/size-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacobcxdev/rust-composable-architecture"
readme = "README.md"
keywords = ["architecture", "state-management", "unidirectional", "async"]
categories = ["asynchronous", "rust-patterns"]

[workspace.dependencies]
rca-core = { path = "rca-core", version = "=0.1.0" }
rca-test = { path = "rca-test", version = "=0.1.0" }
rca-persistence = { path = "rca-persistence", version = "=0.1.0" }
async-channel = { package = "rca-async-channel", path = "dependencies/rca-async-channel", version = "=0.1.0" }
concurrent-queue = "2.5.0"
event-listener = { package = "rca-event-listener", path = "dependencies/rca-event-listener", version = "=0.1.0" }
futures-core = "0.3.34"
futures-channel = "0.3.34"
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
indexmap = "2.14.1"
trybuild = "1.0.120"
ui_test = { version = "=0.30.6", default-features = false, features = ["rustc"] }
divan = "0.1.21"
dhat = "0.3.3"
proptest = "1.11.0"
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "3.0.4", features = ["full"] }
tokio = { version = "1.53.3", features = ["rt", "time"] }
tokio-metrics = "0.5.1"
loom = "0.7"
insta = "1.48.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
literal_string_with_formatting_args = "allow"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
incremental = false
debug = false
strip = true
lto = "fat"

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3

# Bound compiler memory for the core test binaries only.
[profile.test.package.rca-core]
opt-level = 1
debug = 0
